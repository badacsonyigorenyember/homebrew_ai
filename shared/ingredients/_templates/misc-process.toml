# Template: a process aid (fining, nutrient, enzyme, acid ...). Copy to shared/ingredients/misc/<name>.toml.
# "" or [] means "not filled". Required keys must be filled; a filled figure needs its *_ref.
# A process aid has no flavour: leave descriptors empty. It is never tagged or rated for style.
# An enzyme or an acid changes the numbers (gravity, pH): it passes --check but waits for maths.
# Units: g per litre of finished beer (dose_g_per_l), minutes (time_min).
# Nothing is guessed: leave a key empty when the source does not say.

kind = "misc"                      # required, must be "misc" (the folder name)
name = ""                          # required, as the merchant or the book prints it
producer = ""                      # optional, may stay empty
source = ""                        # required, a slug in ref.source or in shared/ingredients/sources/
description = ""                   # required, one to three English sentences from the source
description_ref = ""               # required, page or URL of the description
aliases = []                       # optional, words a brewer types for this product
descriptors = []                   # must stay empty for a process aid

purpose = "process"                # required, must be "process" for this template
category = ""                      # required: fining, nutrient, enzyme, acid or other-process
usages = []                        # required, at least one of: mash, boil, whirlpool, ferment, secondary, packaging
time_min = ""                      # optional, contact time in whole minutes
time_min_ref = ""                  # page or URL, needed when filled
dose_g_per_l = []                  # optional, sourced dose in g per litre of finished beer
dose_g_per_l_ref = ""              # page or URL, needed when filled
