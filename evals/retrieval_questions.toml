# Retrieval test set for the book knowledge base (kb.chunk).
#
# Each [[question]] is something a brewer might ask. `book` is the ref.source slug the answer is
# in. Each [[question.expect]] names a passage by PDF `page` (as Docling reports it) and a short
# `quote` of 4-12 words copied from the chunk; a search result counts as a hit when it comes
# from that book and contains the quote (case, whitespace and quote style ignored). Chunk ids
# are not used, so a re-ingest keeps the set valid. Only short quotes are kept here; the books'
# text is not committed.
#
# Passages were picked evenly by page order before any retrieval was run (9 per book), then
# questions were written from them.
# Reviewed by the user on: 2026-10-16

