# Recipe test briefs (P0): 20 natural-language recipe requests, each with the outcome a
# correct pipeline must produce for the first three steps (style, deviations, what the user asked for).
# Later phases score against this file (RECIPE-ROADMAP P4 and P5).
#
# Style ranges are NOT copied here: whatever reads a brief gets them from ref.beer_style
# (source bjcp-2021). The only numbers in this file are the ones the user stated.
# Brief and requirements: docs/work/test-briefs/brief.md
# Checked by: tests/test_recipe_briefs.py
#
# Fields of every [[brief]] (empty values are "", [] or {}):
#   id          b01, b02, ...
#   request     the user's words, English, one to three sentences
#   why         what this brief tests
#   style       expected best-fit BJCP 2021 code, the base style (adjuncts are ignored)
#   alt_styles  other acceptable codes, only where the request is genuinely ambiguous
#   deviations  { kind, what, from }; kind is ingredient, number, mismatch or conflict
#   stated      only numbers the user stated: batch_l, abv, og, ibu, srm
#   hints       words from the RECIPE-ROADMAP §7 hint table
#   wanted      ingredients the user asked for
#   excluded    ingredients the user ruled out
#   inventory   ingredients the user says they have
#   guidance    style guidance on (true) or off (false)
#   needs       generic ingredients the recipe will need: fermentables, hops, yeast, water_salts

[[brief]]
id = "b01"
request = "I want a classic West Coast IPA that is properly bitter. Make it 20 litres at about 6.5 % ABV."
why = "Hop-forward IPA with the bitter hint and two stated numbers that sit inside the style."
style = "21A"
alt_styles = []
deviations = []
stated = { batch_l = 20, abv = 6.5 }
hints = ["bitter"]
wanted = []
excluded = []
inventory = []
guidance = true
[brief.needs]
fermentables = ["pale ale malt", "crystal malt"]
hops = ["Columbus", "Centennial", "Simcoe"]
yeast = ["American ale yeast"]
water_salts = ["gypsum"]

