# Recipe test briefs (P0): 24 natural-language recipe requests, each with the outcome a
# correct pipeline must produce for the first three steps (style, deviations, what the user asked for).
# Later phases score against this file (RECIPE-ROADMAP P4 and P5).
#
# Style ranges are NOT copied here: whatever reads a brief gets them from ref.beer_style
# (source bjcp-2021). The only numbers in this file are the ones the user stated.
# Brief and requirements: docs/finished/test-briefs/brief.md
# Checked by: tests/test_recipe_briefs.py
#
# Fields of every [[brief]] (empty values are "", [] or {}):
#   id          b01, b02, ...
#   request     the user's words, English, one to three sentences
#   named       the style words the user wrote, without words that only describe the beer
#   why         what this brief tests
#   style       expected best-fit code: BJCP 2021 (e.g. 21A), or a BA 2026 code
#               (e.g. `session-india-pale-ale`) where BA describes the beer better (b21, b22).
#               The base style (adjuncts are ignored), unless the request makes an adjunct a stated, prominent feature; then the specialty code
#               (e.g. 31B), with the base style in alt_styles
#   alt_styles  other acceptable codes, only where the request is genuinely ambiguous
#   deviations  { kind, what, from }; kind is ingredient, number, mismatch or conflict
#   stated      only numbers the user stated: batch_l, abv, og, ibu, srm
#   hints       words from the RECIPE-ROADMAP §7 hint table
#   wanted      ingredients the user asked for, each { item, role }. item is in the user's
#               words: amount words dropped, form words (flaked, ground, malted...) kept.
#               role is `feature` when the user wants the ingredient to stand out (taste or
#               aroma up front, "forward", "shine"), else `background` (supporting, subtle,
#               for body or colour, or no emphasis stated)
#   excluded    ingredients the user ruled out, in the user's words: amount words
#               dropped, form words (flaked, ground, malted...) kept
#   inventory   ingredients the user says they have, in the user's words: amount words
#               dropped, form words (flaked, ground, malted...) kept
#   guidance    style guidance on (true) or off (false)
#   process     what the saved process (steps 12-15) must show; graded by evals/grade.py grade_process
#               (docs/work/m7-process, R7). Only these keys, and `{}` for a brief with no expectation:
#                 ferm_c         [low, high] in °C: every `ferment` step of step 14 lies inside it
#                 diacetyl_rest  true: step 14 has a `rest` step (a lager or ale diacetyl rest)
#                 lagering       true: step 14 ends with a `lager` step (cold lagering)
#                 souring        true: step 14 starts with a `souring` step (a souring culture)
#                 water_row      the ref.water_profile code step 12 must use (water.target.row)
#               Methodology sources: How to Brew first (p. 109 German weizen yeast 18-24 °C, p. 380
#               Bavarian weissbier 17 °C; Table 6.2 and p. 174 for the lager rest and lagering;
#               p. 206-211 for souring); the water rows are Water's Tables 18/19 as mapped in
#               docs/work/m7-process/doc-calc.md §4.
#   needs       generic ingredients the recipe will need: fermentables, hops, yeast, water_salts

