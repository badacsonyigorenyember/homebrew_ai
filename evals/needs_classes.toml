# Which products count for each word in a brief's `needs` (R10).
#
# Written in docs/work/m5-choose-ingredients Task 8 and reviewed by the brewer. evals/grade.py
# `grade_needs` reads it: a class is covered when a pick matches it; a gap when the candidate
# table has a matching product that no pick covers (that fails the brief); absent when the table
# has no matching product. Water salts are M7's and are not here.
#
# A class is either `names` (product names, exact) or all of the fields given:
#   role, ebc [low, high] (overlaps the product's EBC), family (yeast family tag),
#   type (yeast type), origin (hop origin tag), purpose (hop purpose), category (misc).
# `kind` is the key of the brief's `needs`.

