# Role measurement set for the adjunct role (m2-adjunct-role, brief R5).
# Each wording asks for one adjunct; `expected` is the role step 1 should give that adjunct.
# Used by: evals/roles.py. Checked by: tests/test_role_wordings.py.
#
# Fields of every [[wording]]:
#   id        r01.. (clear and ambiguous) or h01.. (held out)
#   set       clear     scored; the role is clear from the words
#             ambiguous reported, not scored (expected is "")
#             held_out  scored; written before the prompt changed
#   adjunct   the word whose role is scored
#   expected  feature | background, or "" for ambiguous
#   source    where the wording came from
#   request   the user's words
#
# HELD-OUT WORDINGS (h01-h10) MUST NEVER BE USED TO TUNE THE PROMPT. They run only in the
# full measurement, so the prompt cannot be fitted to them.

