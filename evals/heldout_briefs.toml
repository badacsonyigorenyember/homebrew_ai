# Held-out recipe briefs: six requests for styles that no brief b01-b24 uses (neither as `style`
# nor in `alt_styles`). Scored only at checkpoints (python -m evals.run --briefs
# evals/heldout_briefs.toml), never while building: nothing is tuned on them.
# The `needs` words are not graded (evals/needs_classes.toml covers the b01-b24 words only), so the
# runner skips the needs grade for this file. These styles have no reviewed envelope, so their
# style-level checks are off (user decision 2026-10-25, "Accept").
# Same fields as evals/recipe_briefs.toml; checked by tests/test_recipe_briefs.py.
# Work: docs/work/m6-compute-validate/plan.md Task 9.

