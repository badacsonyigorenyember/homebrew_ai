# Style-neighbour check set (work item s6-style-neighbours).
#
# What it is: the BJCP exam's "which of these three similar styles?" groupings, as test cases for
# step 2 (best-fit style). Checked by tests/test_style_neighbours.py; run by
# `python -m evals.style_neighbours`.
#
# Source: BJCP Exam Study Guide 2017, question S0 (pages 30-33 as printed). 110 ids were issued;
# 19 are "Pairing removed", so 91 triples remain. The guide's ids are kept as printed.
#
# [[triple]] fields
#   id      the study-guide id
#   names   the three style names exactly as the study guide prints them
#   codes   their BJCP 2021 codes, same order. Found by name in ref.beer_style (accents folded:
#           Märzen = Marzen 6A, Kölsch = Kolsch 5B), except four names mapped by hand:
#           Vienna -> 7A Vienna Lager, English Barleywine -> 17D English Barley Wine,
#           Trappist Single -> 26A Belgian Single, Belgian IPA -> 21B Specialty IPA
#           (Belgian IPA is one of its types).
#   family  the one family noun a user could write that fits all three styles, or "" when the
#           styles span families. A style's family is its BJCP 2021 family tag, turned into a noun:
#             amber-ale, brown-ale, pale-ale, strong-ale   -> ale
#             amber-lager, dark-lager, pale-lager, pilsner -> lager
#             bock -> bock, ipa -> ipa, porter -> porter, stout -> stout, wheat-beer -> wheat
#           (the data's typos bockfamily and dark-lagerfamily read the same; specialty-family is
#           ignored; styles with no family tag have no noun). BJCP files lambics and Berliner
#           Weisse under wheat-beer, so their noun is wheat. That is BJCP's grouping, kept as is.
#
# [[brief]]: one per distinct code (83), ordered by code. Each is a user's sentence plus the step 1
# brief it should produce. Written from the BJCP 2021 entry (ref.beer_style.raw), paraphrased, and
# written without running step 2 on it, so the set is not fitted to the scorer.
#   code      the BJCP 2021 code
#   partners  sorted codes of every style that shares a triple with it
#   request   one sentence a user would write: the numbers and words below, and no BJCP 2021 style
#             name or alias, no study-guide name, no family noun
#   named     always empty here (the runner adds a family noun in its second run)
#   stated    one or two numbers (abv, og, ibu, srm), each inside the style's 2021 range; the number
#             that sets it apart from its partners where one does (Scottish Light, Heavy, Export by
#             ABV; Helles Bock against Doppelbock by OG)
#   hints     words from step 1's hint list: bitter, hoppy, juicy, dry, crisp, full, chewy, malty,
#             darker, stronger, session
#   unknown   any other descriptive word, one word, 4 letters or more (step 2 drops shorter ones),
#             never negated
# Two to four descriptive words (hints + unknown) per brief, each taken from the style's own 2021
# entry (overall impression, aroma, appearance, flavor, mouthfeel, comments, style comparison,
# characteristic ingredients, tags), preferring words that set it apart from its partners.
#
