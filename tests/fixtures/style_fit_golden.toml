# Golden set for app.style_level (s3-style-fit, R8, A4, A5, A8).
# STATUS: APPROVED by the user 2026-10-15 (docs/work/s3-style-fit/golden-review.md, report.md §5).
# Drafted by Claude from brewing judgement and the reviewed envelopes; the user approved every
# theme as drafted except y02 (US-05 in 10A), which they set to out_of_style (the yeast min check).
# Levels were not produced by running code (there was none yet).
#
# Each [[case]]:
#   id         group letter + number (c Citra table, m M3 cases, a adjunct/sugar rule,
#              f fermentable_style bump, h hop character, y yeast, t transforming/specialty,
#              i intensity and style ranges, u unrated / needs review / no dose)
#   style      ref.beer_style.code
#   kind, producer, name   the ingredient as in ref.ingredient
#   usage      hop: boil | whirlpool | dry_hop · fermentable: mash | boil · yeast: ferment
#   dose       inline table, any of minutes, g_per_l, pct, ferm_c, ibu, srm (may be empty)
#   level      required | typical | allowed | out_of_style | changes_style; absent = not rated
#   note       the "because" a homebrewer can check
# Oil dose = g/L x the hop's ref oil midpoint / 100; roast index = % x EBC midpoint.

