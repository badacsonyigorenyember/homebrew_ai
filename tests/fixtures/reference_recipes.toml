# Reference recipes for the 22 test briefs in evals/recipe_briefs.toml (s2-formulation-rules, R16).
# TEST DATA ONLY. Never put these in a prompt, a workflow or a few-shot example: they exist to
# show that the formulation rules (app.check_recipe) accept a realistic recipe for every brief.
# Checked by tests/test_reference_recipes.py. Reviewed by the user: see
# docs/work/s2-formulation-rules/report.md, section 7.
#
# Each [[recipe]] is the input of app.check_recipe in a readable form:
#   brief        the brief id in evals/recipe_briefs.toml
#   style_code   the brief's style (b12: 18A, see its comment)
#   guidance     the brief's guidance flag
#   stated       the brief's stated numbers except batch_l
#   targets      the style midpoints (ref.beer_style), or the stated numbers; with a stated ABV,
#                OG and FG are chosen so that app.abv gives that ABV
#   batch        volume_l is the brief's batch_l or 20; efficiency, boil-off and losses are
#                fixture assumptions (the same for every recipe), not data about any system
#   mash_c, boil_min   process settings (the yeast table carries its own ferm_c)
#   fermentable  producer + name (as in ref.ingredient), pct of the grist, purpose
#   hop          name, usage (boil | whirlpool | dry_hop), minutes, g, purpose
#   yeast        producer + name, ferm_c, purpose
# Only ingredients that exist in the ref tables are used.

# ---------------------------------------------------------------- b01 West Coast IPA
[[recipe]]
brief = "b01"
style_code = "21A"
guidance = true
stated = { abv = 6.5 }
targets = { og = 1.0615, fg = 1.011, abv = 6.5, ibu = 55, srm = 10 }
batch = { volume_l = 20, efficiency_pct = 72, boil_off_l_h = 4, losses_l = 2 }
mash_c = 65
boil_min = 60
fermentable = [
  { producer = "Weyermann", name = "Pale Ale Malt", pct = 92, purpose = "base malt" },
  { producer = "Weyermann", name = "Caramunich Type 1", pct = 8, purpose = "colour and light caramel body" },
]
hop = [
  { name = "Columbus", usage = "boil", minutes = 60, g = 26, purpose = "bittering" },
  { name = "Centennial", usage = "boil", minutes = 10, g = 20, purpose = "flavour" },
  { name = "Simcoe", usage = "whirlpool", minutes = 20, g = 30, purpose = "aroma" },
  { name = "Simcoe", usage = "dry_hop", minutes = 4320, g = 40, purpose = "dry-hop aroma" },
]
yeast = { producer = "Fermentis", name = "SafAle US-05", ferm_c = 19, purpose = "clean American ale fermentation" }

