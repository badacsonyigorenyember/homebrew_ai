[[fermentable]]
producer = ""
name = "Flaked Oats"
role = "adjunct"
role_source = "user-supplied"
role_note = "R1 list (user decision Q2, 2026-10-15)"
max_pct = 30
max_pct_source = "user-supplied"
max_pct_basis = "Viking catalogue, p. 18: Oat Malt 'up to 20% (30%)' (malted oats, not flakes; the closest printed figure)"
description = "Flaked oats that add protein for foam and head retention and give a dry, light beer. A high share makes lautering harder, so rice hulls may be needed. Used in NEIPA and other hazy beers."
description_source = "hopline-adjuncts"
description_ref = "https://www.hopline.hu/zab-pehely-100g-930"

[[fermentable]]
producer = ""
name = "Flaked Rice"
role = "adjunct"
role_source = "user-supplied"
role_note = "R1 list (user decision Q2, 2026-10-15)"
description = "Flaked rice that lowers the body and gives a clean fermentation. Up to 40 % is possible and most recipes use about 20 %. It lowers protein and foam a little and leaves little yeast nutrient, so yeast nutrient is advised. Used in triple IPA, lager and pils."
description_source = "hopline-adjuncts"
description_ref = "https://www.hopline.hu/rizspehely-100g"

[[fermentable]]
producer = ""
name = "Honey"
role = "sugar"
role_source = "user-supplied"
role_note = "R1 list (user decision Q2, 2026-10-15)"
max_pct = 20
max_pct_source = "user-supplied"
max_pct_basis = "How to Brew estimate, printed p. 437: 11%-30% of the fermentables gives a distinct honey flavour (20 is inside that range; the book states no maximum)"
description = "About 18 % water; 95 % of its carbohydrates are fermentable (mostly fructose and glucose). It adds honey flavour that depends on the nectar source. 3-10 % of the fermentables gives a subtle honey flavour in light beers and 11-30 % a distinct one."
description_source = "palmer-how-to-brew"
description_ref = "p. 435 and p. 437"

[[fermentable]]
producer = ""
name = "Lactose"
role = "sugar"
role_source = "user-supplied"
role_note = "R1 list (user decision Q2, 2026-10-15)"
max_pct = 10
max_pct_source = "user-supplied"
max_pct_basis = "user decision E, 2026-10-14"
description = "Unfermentable milk sugar that makes the beer fuller, creamier and sweeter, and is not fermented away. Added in the last 5 minutes of the boil or dissolved in hot water into the finished beer; 300 g per 20 L is a good starting point. Used in milk stouts, milkshake beers and pastry ales."
description_source = "hopline-adjuncts"
description_ref = "https://www.hopline.hu/laktoz-250-g"

