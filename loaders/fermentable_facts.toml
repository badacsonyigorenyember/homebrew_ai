# Hand-checked facts for ref.fermentable (s2-formulation-rules), read by loaders/fermentable_facts.py.
# One [[fermentable]] per row of the 81, keyed by producer ("" for the 7 adjuncts and sugars) and
# name exactly as in ref.ingredient. A field that is absent here is not loaded.
#   role, role_source, role_note   R1: chart group and row, or the R1 list
#   max_pct, max_pct_source, max_pct_basis   only the 18 values of user decision E; the basis is where
#                                  the value comes from, or "unplaced" until the user has placed it
#   enzyme_activity, enzyme_source, enzyme_ref   what the maltster prints (Weyermann "medium" = normal)
#   min_boil_min                   only user-confirmed values above 60 (the 7 of Task 4)
#   description, description_source, description_ref   one to three English sentences from the
#                                  source; ref = page of the PDF ("p. N" counts PDF pages, as
#                                  enzyme_ref does; How to Brew: printed page) or the hopline URL
#   style_names, styles_source     the style names the source prints, as printed (malts only)
# [[substitute]] lists each pair once, either way round.
# [style_names] (last table) maps every printed name, lower case, to one ref.beer_style code or "".

