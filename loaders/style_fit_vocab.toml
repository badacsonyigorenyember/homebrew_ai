# The hand-made vocabulary for style fit (s3-style-fit), read by loaders/tags.py.
# Everything in ref.tag, ref.tag_synonym and ref.sensory_dimension comes from this file;
# ref.ingredient_tag is derived from it by code. Add a word here and run `python -m loaders.tags`.
#
#   [[dimension]]            a sensation a style envelope can describe; class decides what a
#                            style's silence means (core: nothing, specialty: out of style,
#                            transforming: changes the style)
#   [[tag]]                  facet origin (hop country codes of ref.hop.origins), family (the
#                            six fermentable roles, the yeast families) or character (a tree:
#                            a child matches its parent by half, see STYLE-FIT.md §5)
#   [synonyms]               a word -> a character tag. The key is loaders.common.name_key of the
#                            word (lower case, no accents, only a-z and 0-9): "Citrusos" is
#                            citrusos, "fekete bors" is feketebors. Hungarian shop words and the
#                            English words the style guidelines use.
#   [no_character]           known words that carry no character: neither tagged nor flagged
#   [filler]                 words dropped from either end of a phrase before it is looked up
#   [yeast_family]           the shop's Stílus value (name_key) -> a family tag; a yeast whose
#                            Stílus is not here falls back to ref.yeast.type
#   [yeast_family_override]  a yeast name (name_key) -> family, where the shop's Stílus is too
#                            general (SafAle US-05 is "Ale" there)

