# =============================================================================
# Homebrewing Assistant — docker-compose (fresh rebuild)
# Target profile: gpu-amd  (Ryzen 9900X / RX 9070 XT gfx1201 / 32 GB RAM)
#
# Differences from the self-hosted-ai-starter-kit this is based on:
#   - Qdrant removed          (architecture §3.6 — pgvector only)
#   - Open WebUI removed       (architecture D5 — chat.html is the interface)
#   - Ollama pulls gemma4:12b-it-q8_0 + bge-m3, NOT llama3.2 (architecture §4)
#   - Ollama pinned/keep-alive so chat + embedder stay resident (§4.5)
#   - db-init service applies the kb/ref/brew/mem/nlq schema to Supabase Postgres
#   - n8n demo-data import removed (fresh build — no demo workflow, §12 #6)
#
# Bring up (AMD GPU on Linux):   docker compose --profile gpu-amd up -d
# CPU-only fallback:             docker compose --profile cpu up -d
# =============================================================================

include:
  - ./supabase/docker/docker-compose.yml   # app Postgres (pgvector) + Supabase stack

volumes:
  n8n_storage:
  postgres_storage:
  ollama_storage:

networks:
  demo:

# --- shared service definitions (YAML anchors) -------------------------------

x-n8n: &service-n8n
  image: n8nio/n8n:latest
  networks: ['demo', 'default']
  environment:
    - DB_TYPE=postgresdb
    - DB_POSTGRESDB_HOST=postgres
    - DB_POSTGRESDB_USER=${N8N_POSTGRES_USER}
    - DB_POSTGRESDB_PASSWORD=${N8N_POSTGRES_PASSWORD}
    - N8N_DIAGNOSTICS_ENABLED=false
    - N8N_PERSONALIZATION_ENABLED=false
    - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
    - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
    - OLLAMA_HOST=${OLLAMA_HOST:-ollama:11434}
    - N8N_RESTRICT_FILE_ACCESS_TO=/data/shared
    # Resolved at answer-assembly time into image URLs (architecture §3.8)
    - IMAGE_BASE_URL=${IMAGE_BASE_URL:-http://localhost:8080}
    - NODES_EXCLUDE=[]

x-ollama: &service-ollama
  image: ollama/ollama:latest
  container_name: ollama
  networks: ['demo']
  restart: unless-stopped
  ports:
    - 11434:11434
  volumes:
    - ollama_storage:/root/.ollama
  environment:
    # Pin models resident — do not unload chat/embedder between requests (§4.5)
    - OLLAMA_KEEP_ALIVE=-1
    - OLLAMA_MAX_LOADED_MODELS=2   # exactly chat + embedder
    - OLLAMA_NUM_PARALLEL=1        # single user; parallelism only fragments KV cache
  # mem_limit: 8g   # R2 mitigation — tune to your host, then uncomment (§13.1)

x-init-ollama: &init-ollama
  image: ollama/ollama:latest
  networks: ['demo']
  container_name: ollama-pull
  volumes:
    - ollama_storage:/root/.ollama
  entrypoint: /bin/sh
  environment:
    - OLLAMA_HOST=ollama:11434
  # Pull the embedder first (blocks §Start-tomorrow dim check), then the chat model.
  command:
    - "-c"
    - "sleep 3; ollama pull ${OLLAMA_EMBED_MODEL:-bge-m3}; ollama pull ${OLLAMA_CHAT_MODEL:-gemma4:12b-it-q8_0}"

x-docling: &service-docling
  image: ghcr.io/docling-project/docling-serve:main
  container_name: docling
  networks: ['demo']
  restart: unless-stopped
  user: root                                # fix bind-mount perms
  working_dir: /shared/docling-scratch      # referenced images land in shared/
  expose:
    - 5001/tcp
  ports:
    - 5001:5001
  environment:
    - DOCLING_SERVE_ENABLE_UI=true
    - DOCLING_SERVE_SCRATCH_PATH=/shared/docling-scratch
    - DOCLING_SERVE_SINGLE_USE_RESULTS=false
    - GRADIO_ALLOWED_PATHS=/shared
    - GRADIO_TEMP_DIR=/shared/docling-scratch
    - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
  volumes:
    - ./shared:/shared
  # mem_limit: 8g   # PyTorch is memory-hungry — tune and uncomment (§13.1)
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

services:

  # --- n8n metadata store (workflow definitions ONLY — never app data, §12 #11)
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    networks: ['demo']
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${N8N_POSTGRES_USER}
      - POSTGRES_PASSWORD=${N8N_POSTGRES_PASSWORD}
      - POSTGRES_DB=${N8N_POSTGRES_DB}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h localhost -U ${N8N_POSTGRES_USER} -d ${N8N_POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- orchestration & glue ONLY (architecture §2) ---------------------------
  n8n:
    <<: *service-n8n
    hostname: n8n
    container_name: n8n
    restart: unless-stopped
    user: root   # access shared files created by Docling (also root)
    ports:
      - 5678:5678
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/demo-data:/demo-data
      - ./shared:/data/shared
      - ./shared/rag-files:/data/rag-files
    depends_on:
      postgres:
        condition: service_healthy

  # --- schema migration runner: kb/brew/mem/nlq -> Supabase Postgres ---------
  # Idempotent; applies db/init/*.sql then exits. Re-run: docker compose up db-init
  db-init:
    image: postgres:16-alpine
    container_name: homebrew-db-init
    networks: ['demo', 'default']
    restart: "no"
    environment:
      - PGHOST=db
      - PGPORT=${POSTGRES_PORT:-5432}
      - PGUSER=${POSTGRES_USER:-postgres}
      - PGDATABASE=${POSTGRES_DB:-postgres}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - AGENT_DB_PASSWORD=${AGENT_DB_PASSWORD:-changeme_agent}
      - MEM_WRITER_DB_PASSWORD=${MEM_WRITER_DB_PASSWORD:-changeme_mem}
    volumes:
      - ./db/init:/db-init:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Waiting for Supabase Postgres at $$PGHOST:$$PGPORT ..."
        until pg_isready -h "$$PGHOST" -p "$$PGPORT" -U "$$PGUSER" >/dev/null 2>&1; do
          sleep 2
        done
        echo "Postgres is up. Applying schema migrations ..."
        # NOTE: this list is the execution order and it does NOT glob. A new
        # db/init/*.sql file silently never runs until its name is added here.
        # 15_ref.sql must precede 20_brew.sql: brew.recipes.style_id -> ref.styles.
        #
        # ⛔ THE BREWERSFRIEND CORPUS WAS DROPPED ON 2026-09-19 and corpus.* is
        # now the single table 75_corpus_recipes.sql creates. Five files left
        # this list with it -- 70_corpus, 71_corpus_dims, 72_nlq_corpus,
        # 73_corpus_search, 74_corpus_styles -- and they take two dependants
        # with them, which is why the out-of-order tail this comment used to
        # explain is gone:
        #   33_brew_yeast.sql    seeded brew.ingredients FROM corpus.yeasts.
        #                        ⚠️ Rows already seeded survive in the live
        #                        database; a FRESH one loses ~120 yeast entries.
        #   35_nlq_evidence.sql  needed 73_'s f_resolve_ingredient and 74_'s
        #                        style fold, and read four dropped tables.
        # All seven files are still on disk, unmodified, so restoring the corpus
        # is a matter of putting the names back.
        for f in /db-init/00_extensions.sql /db-init/10_kb.sql /db-init/15_ref.sql \
                 /db-init/20_brew.sql /db-init/26_ref_fermentables.sql /db-init/27_brew_catalogue.sql \
                 /db-init/28_brew_derived_sugars.sql /db-init/29_brew_formulate.sql \
                 /db-init/30_mem.sql \
                 /db-init/31_brew_misc.sql /db-init/32_brew_sugars.sql \
                 /db-init/40_nlq.sql /db-init/60_obs.sql \
                 /db-init/62_obs_recipe_prompts.sql /db-init/63_model_switch.sql \
                 /db-init/75_corpus_recipes.sql /db-init/76_fermentable_types.sql \
                 /db-init/77_bf_corpus.sql /db-init/78_trend.sql \
                 /db-init/79_drop_dead_nlq.sql; do
          echo ">> $$f"
          psql -v ON_ERROR_STOP=1 -f "$$f"
        done
        # ⚠️ ROLES ARE CREATED *AFTER* EVERYTHING THAT GRANTS TO THEM, and on a
        # FRESH CLUSTER that aborts the run. `measured` 2026-09-16: an unguarded
        # GRANT naming a role that does not exist is an ERROR, not a no-op, and
        # 15_ref.sql line 237 grants to mem_writer -- so with ON_ERROR_STOP=1 a
        # brand-new cluster dies there and every later file is skipped. 16 such
        # grant sites exist across 15_, 29_ and 60_. (73_ and 35_ used to guard
        # theirs behind IF EXISTS (SELECT 1 FROM pg_roles ...) instead, which
        # survived but silently skipped; both left the list on 2026-09-19.)
        #
        # It has never bitten this machine because the roles already exist and
        # every restart re-runs the list with them in place.
        #
        # ⛔ NOT FIXED HERE ON PURPOSE. The fix is to create the roles before the
        # loop and keep only the blanket grants in 50_roles.sql -- 50_ cannot
        # simply move earlier, because it does GRANT EXECUTE ON ALL FUNCTIONS IN
        # SCHEMA nlq, which must follow 40_. That is a change to
        # security-sensitive role management and deserves its own commit and its
        # own fresh-cluster test, not a ride along with a feature.
        echo ">> /db-init/50_roles.sql"
        psql -v ON_ERROR_STOP=1 \
             -v agent_pw="$$AGENT_DB_PASSWORD" \
             -v mem_pw="$$MEM_WRITER_DB_PASSWORD" \
             -f /db-init/50_roles.sql
        echo "Schema migrations complete."

  # --- static file server for extracted images (architecture §3.8) ----------
  # http://localhost:8080/<image_dir>/<image_ref>  (IMAGE_BASE_URL)
  static-files:
    image: nginx:alpine
    hostname: static-files
    container_name: static-files
    networks: ['demo']
    restart: unless-stopped
    ports:
      - 8080:80
    volumes:
      - ./shared/extracted-images:/usr/share/nginx/html:ro
    command: |
      sh -c "echo 'server {
        listen 80;
        root /usr/share/nginx/html;
        autoindex on;
        location / {
          try_files \$$uri \$$uri/ =404;
          add_header Access-Control-Allow-Origin *;
        }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  # ===========================================================================
  # webarm — search + fetch + chunk + embed + rank, behind one HTTP call (§3.4)
  # Lives outside n8n for the same reason the retrieval SQL does: it is a fetch
  # loop wrapped around a docling poll loop, which n8n expresses badly.
  # ===========================================================================
  webarm:
    build: ./services/webarm
    hostname: webarm
    container_name: webarm
    networks: ['demo']
    restart: unless-stopped
    # Published for probing only; n8n reaches it as http://webarm:5055.
    ports:
      - 5055:5055
    environment:
      - SEARXNG_URL=http://searxng:8080
      - DOCLING_URL=http://docling:5001
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:5055/healthz',timeout=5)\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # SearXNG — search backend for the web arm of retrieval (§3.4)
  # Not profile-gated: it is CPU-only and tiny, and the retrieval fallback needs
  # it under every profile.
  # ===========================================================================
  searxng:
    image: searxng/searxng:latest
    hostname: searxng
    container_name: searxng
    networks: ['demo']
    restart: unless-stopped
    # Published for probing only. n8n reaches it as http://searxng:8080 on `demo`.
    ports:
      - 8081:8080
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
    volumes:
      # ⚠️ Read-WRITE on purpose: the image's entrypoint rewrites the
      # `ultrasecretkey` placeholder in place from SEARXNG_SECRET. A :ro mount
      # makes the container fail at start with a sed permission error.
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8080/healthz' >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Ollama — profile-gated (cpu | gpu-nvidia | gpu-amd)
  # ===========================================================================
  ollama-cpu:
    profiles: ["cpu"]
    <<: *service-ollama

  ollama-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-ollama
    image: ollama/ollama:rocm   # gfx1201/RDNA4 — verify GPU residency with `ollama ps` (§4.1)
    devices:
      - "/dev/kfd"
      - "/dev/dri"
    # environment inherited from anchor; if the card is not auto-detected,
    # add:  - HSA_OVERRIDE_GFX_VERSION=12.0.1   (documented fallback, §13.1 R1)

  ollama-pull-cpu:
    profiles: ["cpu"]
    <<: *init-ollama
    depends_on:
      - ollama-cpu

  ollama-pull-gpu:
    profiles: ["gpu-nvidia"]
    <<: *init-ollama
    depends_on:
      - ollama-gpu

  ollama-pull-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *init-ollama
    image: ollama/ollama:rocm
    depends_on:
      - ollama-gpu-amd

  # ===========================================================================
  # Docling Serve — profile-gated. Async convert + HybridChunker (§6)
  # ===========================================================================
  docling-cpu:
    profiles: ["cpu"]
    <<: *service-docling

  docling-gpu:
    profiles: ["gpu-nvidia"]
    <<: *service-docling
    image: ghcr.io/docling-project/docling-serve-cu126:main
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_SCRATCH_PATH=/shared/docling-scratch
      - DOCLING_SERVE_SINGLE_USE_RESULTS=false
      - GRADIO_ALLOWED_PATHS=/shared
      - GRADIO_TEMP_DIR=/shared/docling-scratch
      - NVIDIA_VISIBLE_DEVICES=all
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
    runtime: nvidia

  docling-gpu-amd:
    profiles: ["gpu-amd"]
    <<: *service-docling
    environment:
      - DOCLING_SERVE_ENABLE_UI=true
      - DOCLING_SERVE_SCRATCH_PATH=/shared/docling-scratch
      - DOCLING_SERVE_SINGLE_USE_RESULTS=false
      - GRADIO_ALLOWED_PATHS=/shared
      - GRADIO_TEMP_DIR=/shared/docling-scratch
      - ROCR_VISIBLE_DEVICES=0
      - DOCLING_SERVE_ENABLE_REMOTE_SERVICES=true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "44"    # video  group GID  — verify: getent group video
      - "992"   # render group GID  — verify: getent group render
